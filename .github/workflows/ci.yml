name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile every module
        run: python -m compileall -q app.py gitosaurus

      - name: Import every module
        run: >
          python -c "import pkgutil, importlib, gitosaurus;
          names = [m.name for m in pkgutil.walk_packages(gitosaurus.__path__, 'gitosaurus.')];
          [importlib.import_module(n) for n in names];
          print('imported', len(names), 'modules')"

      - name: Start the app headlessly and check that it renders
        run: >
          python -c "from streamlit.testing.v1 import AppTest;
          at = AppTest.from_file('app.py', default_timeout=60).run();
          assert not at.exception, at.exception;
          print('app renders without an exception')"
