name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install a current Git
        if: runner.os == 'Linux'
        # The tests use `git --no-lazy-fetch`, which needs Git 2.44 or newer; Ubuntu images ship an older one.
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git

      - name: Show versions
        run: |
          git --version
          python --version

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest
